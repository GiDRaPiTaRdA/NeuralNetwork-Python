<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 × 10 Digit Recognizer</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1d2433;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,560px);background:white;padding:28px;border-radius:18px;box-shadow:0 12px 45px #26334d17}h1{margin:0 0 7px;font-size:26px}p{color:#647084;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;border:2px solid #273142;background:#cbd2dc;gap:1px;touch-action:none;user-select:none}.pixel{background:white;cursor:crosshair}.pixel.on{background:#000}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}button{border:1px solid #d1d7e2;background:white;color:#1d2433;border-radius:9px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer}button.active{background:#1d2433;color:white;border-color:#1d2433}button:hover{filter:brightness(.94)}.prediction{border:1px solid #d1d7e2;border-radius:12px;padding:18px;margin-top:8px}.prediction-header{display:flex;align-items:center;justify-content:space-between;gap:12px}.prediction-label{font-size:14px;font-weight:650}.predicted-digit{font-size:64px;font-weight:750;line-height:1.1;margin:8px 0}.status{font-size:12px;color:#647084;min-height:18px}.scores{display:grid;gap:7px;margin-top:14px}.score-row{display:grid;grid-template-columns:22px 1fr 65px;align-items:center;gap:10px;font-size:12px}.score-track{height:9px;border-radius:9px;background:#e9edf4;overflow:hidden}.score-fill{height:100%;width:0;background:#59677e;transition:width .15s}.score-row.best .score-fill{background:#1d2433}.score-value{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body><main class="app">
<h1>10 × 10 Digit Recognizer</h1><p>Draw a digit and watch the neural network guess it.</p>
<div id="grid" class="grid" aria-label="10 by 10 drawing grid"></div>
<div class="tools"><button id="draw" class="active">✏ Draw</button><button id="erase">◻ Erase</button><button id="clear">Clear</button><button id="copy">Copy 100 values</button><button id="download">Save PNG</button></div>
<section class="prediction" aria-live="polite"><div class="prediction-header"><span class="prediction-label">Live prediction</span><span id="status" class="status">Waiting for drawing…</span></div><div id="predicted-digit" class="predicted-digit">–</div><div id="scores" class="scores"></div></section>
</main>
<script>
const pixels=Array(100).fill(0),grid=document.getElementById('grid');
const digitElement=document.getElementById('predicted-digit'),statusElement=document.getElementById('status'),scoresElement=document.getElementById('scores');
let mode=1,painting=false,predictionTimer,requestVersion=0;
for(let i=0;i<10;i++){
  const row=document.createElement('div');row.className='score-row';
  row.innerHTML=`<span>${i}</span><div class="score-track"><div class="score-fill"></div></div><span class="score-value">–</span>`;
  scoresElement.appendChild(row);
}
function refresh(){[...grid.children].forEach((cell,i)=>cell.classList.toggle('on',pixels[i]===1));}
function schedulePrediction(){
  clearTimeout(predictionTimer);
  const version=++requestVersion;
  statusElement.textContent='Updating…';
  predictionTimer=setTimeout(()=>predict(version),120);
}
async function predict(version){
  try{
    const response=await fetch('/guess',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pixels:[...pixels]})
    });
    const result=await response.json();
    if(version!==requestVersion)return;
    if(!response.ok)throw new Error(result.error||'Prediction failed');
    const digit=result.prediction;
    digitElement.textContent=digit;
    [...scoresElement.children].forEach((row,i)=>{
      const score=Number(result.scores[i]);
      row.classList.toggle('best',i===digit);
      row.querySelector('.score-fill').style.width=`${Math.max(0,Math.min(100,score))}%`;
      row.querySelector('.score-value').textContent=`${score.toFixed(2)}%`;
    });
    statusElement.textContent='Up to date';
  }catch(error){
    if(version!==requestVersion)return;
    statusElement.textContent='Server unavailable';
    digitElement.textContent='–';
    console.error(error);
  }
}
function paint(i){if(pixels[i]===mode)return;pixels[i]=mode;refresh();schedulePrediction();}
for(let i=0;i<100;i++){const cell=document.createElement('div');cell.className='pixel';cell.dataset.index=i;grid.appendChild(cell);}
grid.addEventListener('pointerdown',e=>{const cell=e.target.closest('.pixel');if(!cell)return;painting=true;paint(+cell.dataset.index);grid.setPointerCapture(e.pointerId);});
grid.addEventListener('pointermove',e=>{if(!painting)return;const el=document.elementFromPoint(e.clientX,e.clientY);const cell=el?.closest('.pixel');if(cell&&grid.contains(cell))paint(+cell.dataset.index);});
grid.addEventListener('pointerup',()=>painting=false);grid.addEventListener('pointercancel',()=>painting=false);
function setMode(next){mode=next;document.getElementById('draw').classList.toggle('active',mode===1);document.getElementById('erase').classList.toggle('active',mode===0);}
document.getElementById('draw').onclick=()=>setMode(1);document.getElementById('erase').onclick=()=>setMode(0);
document.getElementById('clear').onclick=()=>{pixels.fill(0);refresh();schedulePrediction();};
document.getElementById('copy').onclick=async()=>{const text='['+pixels.join(', ')+']';try{await navigator.clipboard.writeText(text);}catch{const textarea=document.createElement('textarea');textarea.value=text;document.body.appendChild(textarea);textarea.select();document.execCommand('copy');textarea.remove();}};
document.getElementById('download').onclick=()=>{const canvas=document.createElement('canvas');canvas.width=10;canvas.height=10;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,10,10);ctx.fillStyle='#000';pixels.forEach((v,i)=>{if(v)ctx.fillRect(i%10,Math.floor(i/10),1,1)});const link=document.createElement('a');link.download='drawing-10x10.png';link.href=canvas.toDataURL('image/png');link.click();};
refresh();schedulePrediction();
</script></body></html>
